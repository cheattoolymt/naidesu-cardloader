<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>naidesu-cardloader — 読み取り (Decoder)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/vendor/pako.min.js"></script>
<script src="js/reed-solomon.js"></script>
<script src="js/card-format.js"></script>
<script src="js/geometry.js"></script>
<script src="js/decode-core.js"></script>
<script src="js/compress.js"></script>
<style>
  :root { --accent:#2563eb; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --bg:#0f172a; --card:#1e293b; --line:#334155; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: system-ui,-apple-system,"Segoe UI","Hiragino Sans",sans-serif;
         margin:0; background:var(--bg); color:#e2e8f0; padding:12px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.25rem; margin:.2em 0; }
  .sub { color:#94a3b8; font-size:.82rem; margin-bottom:.8rem; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  input[type=file] { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0b1220; color:#e2e8f0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  button { cursor:pointer; border:0; border-radius:9px; padding:11px 12px; font-weight:600; color:#fff; background:var(--accent); width:100%; font-size:.95rem; }
  button.ok { background:var(--ok); } button.warn{ background:var(--warn);} button.ghost{ background:#475569;}
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { font-size:.85rem; margin:8px 0; white-space:pre-line; }
  .status.ok{color:#86efac;} .status.bad{color:#fca5a5;} .status.info{color:#93c5fd;}
  .canvas-wrap { position:relative; overflow:auto; background:#000; border-radius:8px; touch-action:none; }
  canvas#view { display:block; width:100%; height:auto; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.72rem; margin:2px; }
  .pill.have{ background:#065f46; color:#d1fae5;} .pill.miss{ background:#7f1d1d; color:#fecaca;}
  ul.pages{ list-style:none; padding:0; margin:6px 0; font-size:.82rem;}
  ul.pages li{ padding:4px 0; border-bottom:1px solid var(--line);}
  a.homelink{ color:#93c5fd; font-size:.85rem;}
  .hint{ font-size:.75rem; color:#94a3b8; margin-top:6px;}
  label.chk{ display:flex; align-items:center; gap:8px; font-size:.85rem; color:#cbd5e1;}
</style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📇</text></svg>">
</head>
<body>
<div class="wrap">
  <h1>🔍 naidesu-cardloader — 読み取り</h1>
  <div class="sub">
    印刷したカードのスキャン画像(300dpi程度)/写真/PDF を読み込み、バイナリに復元します。
    1KB〜10KB のモード・誤り訂正(ECC)レベルは<b>自動判別</b>し、汚れ・かすれ・折れで読み違えたマスは
    <b>インターリーブ＋誤り訂正で自動復元</b>します。四隅の黒い■を自動検出 → ズレていれば赤い枠の角をドラッグして合わせます。
    スマホの斜め撮影は<b>射影変換で自動補正</b>します。
    <a class="homelink" href="creator.html">→ 作成(Creator)へ</a>
  </div>

  <div class="panel">
    <input type="file" id="file" accept="application/pdf,image/*">
    <div class="hint" id="pdfPageHint" style="display:none;"></div>
    <div class="row" style="margin-top:10px;">
      <button id="autoBtn" class="ghost" disabled>四隅を自動検出</button>
      <button id="decodeBtn" disabled>このページを解析して追加</button>
    </div>
    <div class="status info" id="status">画像またはPDFを選択してください</div>
    <label class="chk"><input type="checkbox" id="invert"> 白黒反転（黒背景スキャン等）</label>
  </div>

  <div class="panel">
    <div class="canvas-wrap" id="cw">
      <canvas id="view"></canvas>
    </div>
    <div class="hint">赤枠の4隅（青ハンドル）をドラッグしてグリッドをデータ範囲に合わせます。スマホはタッチ操作可。</div>
  </div>

  <div class="panel">
    <div style="font-size:.9rem;color:#cbd5e1;margin-bottom:6px;">収集状況</div>
    <div id="pagePills"></div>
    <ul class="pages" id="pageList"></ul>
    <div class="row" style="margin-top:8px;">
      <button id="exportBtn" class="ok" disabled>全ページ結合してファイル保存</button>
      <button id="resetBtn" class="warn">リセット</button>
    </div>
    <div class="status" id="exportStatus"></div>
  </div>
</div>

<script>
const CF = window.CardFormat;
const GEO = window.NaidesuGeometry;
const DC = window.NaidesuDecodeCore;
const pdfjsLib = window['pdfjsLib'] || window['pdfjs-dist/build/pdf'];
if (pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const view = document.getElementById('view');
const vctx = view.getContext('2d', { willReadFrequently: true });

// 元画像を保持する(高解像度)オフスクリーン canvas
let src = document.createElement('canvas');
let sctx = src.getContext('2d', { willReadFrequently: true });
let hasImage = false;

// グリッド四隅（元画像座標系）: TL, TR, BR, BL
let corners = null;
let dragIdx = -1;

const statusEl = document.getElementById('status');
function setStatus(msg, cls) { statusEl.className = 'status ' + (cls || 'info'); statusEl.textContent = msg; }

// 収集済みページ: pageIndex -> {payload, header, meta}
let collected = {};      // key: pageIndex
let expectedTotal = null; // totalPages
let expectedFileLen = null;
let expectedMode = null;  // '1kb' | '2kb' | '3kb'（最初に読めたページのモードで固定）

/* ============ ファイル読み込み ============ */
let pdfDoc = null, pdfPageNum = 1;
document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  pdfDoc = null;
  document.getElementById('pdfPageHint').style.display = 'none';
  if (f.type === 'application/pdf') {
    const buf = await f.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    pdfPageNum = 1;
    await renderPdfPage();
  } else {
    const img = new Image();
    img.onload = () => { loadImageToSrc(img, img.naturalWidth, img.naturalHeight); };
    img.src = URL.createObjectURL(f);
  }
};

async function renderPdfPage() {
  const page = await pdfDoc.getPage(pdfPageNum);
  // 300dpi 相当を狙って scale を決める。PDFは 72dpi 基準。
  const scale = 300 / 72;
  const vp = page.getViewport({ scale });
  const tmp = document.createElement('canvas');
  tmp.width = Math.round(vp.width); tmp.height = Math.round(vp.height);
  await page.render({ canvasContext: tmp.getContext('2d'), viewport: vp }).promise;
  loadImageToSrc(tmp, tmp.width, tmp.height);

  const hint = document.getElementById('pdfPageHint');
  if (pdfDoc.numPages > 1) {
    hint.style.display = 'block';
    hint.innerHTML = `PDF ${pdfPageNum}/${pdfDoc.numPages} ページ　` +
      `<button style="width:auto;padding:4px 10px;display:inline-block" onclick="prevPdf()">◀前</button> ` +
      `<button style="width:auto;padding:4px 10px;display:inline-block" onclick="nextPdf()">次▶</button>`;
  }
}
window.prevPdf = async () => { if (pdfPageNum > 1) { pdfPageNum--; await renderPdfPage(); } };
window.nextPdf = async () => { if (pdfPageNum < pdfDoc.numPages) { pdfPageNum++; await renderPdfPage(); } };

function loadImageToSrc(imgOrCanvas, w, h) {
  src.width = w; src.height = h;
  sctx.drawImage(imgOrCanvas, 0, 0, w, h);
  hasImage = true;
  document.getElementById('autoBtn').disabled = false;
  document.getElementById('decodeBtn').disabled = false;
  setStatus('画像を読み込みました。四隅を自動検出します…', 'info');
  autoDetect(); // 自動で一度検出を試みる
}

/* ============ 表示 ============ */
function redraw() {
  view.width = src.width; view.height = src.height;
  vctx.drawImage(src, 0, 0);
  if (!corners) return;
  // グリッド線（赤）。射影変換(ホモグラフィ)で (u,v)→画像座標に写して描くので、
  // 斜め撮影で台形に歪んでいても線がデータ枠に沿う。
  const H = GEO.computeHomography(corners);
  const mapUV = (u, v) => H ? GEO.applyHomography(H, u, v) : GEO.bilinearMap(corners, u, v);
  vctx.strokeStyle = 'rgba(255,0,0,0.7)';
  vctx.lineWidth = Math.max(1, src.width / 1000);
  // グリッド線は表示目安（実サンプリングは各モードの profile で行う）。
  // モードは解析時まで未確定なので、u,v を等間隔(1/16)で引いて枠内を目安表示する。
  const stepR = 1 / 16, stepC = 1 / 16;
  for (let t = 0; t <= 1.0001; t += stepR) {
    const v = Math.min(t, 1);
    line(mapUV(0, v), mapUV(1, v));
  }
  for (let t = 0; t <= 1.0001; t += stepC) {
    const u = Math.min(t, 1);
    line(mapUV(u, 0), mapUV(u, 1));
  }
  // 外枠を強調
  vctx.lineWidth = Math.max(2, src.width / 500);
  vctx.beginPath();
  vctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < 4; i++) vctx.lineTo(corners[i].x, corners[i].y);
  vctx.closePath(); vctx.stroke();
  // ハンドル
  const hs = Math.max(10, src.width / 90);
  const labels = ['TL', 'TR', 'BR', 'BL'];
  corners.forEach((p, i) => {
    vctx.fillStyle = i === 0 ? '#22d3ee' : '#3b82f6';
    vctx.fillRect(p.x - hs, p.y - hs, hs * 2, hs * 2);
    vctx.fillStyle = '#fff'; vctx.font = `${hs*1.4}px sans-serif`; vctx.textAlign = 'center';
    vctx.fillText(labels[i], p.x, p.y - hs - 4);
  });
}
function line(a, b) { vctx.beginPath(); vctx.moveTo(a.x, a.y); vctx.lineTo(b.x, b.y); vctx.stroke(); }
function lerp(p1, p2, f) { return { x: p1.x + (p2.x - p1.x) * f, y: p1.y + (p2.y - p1.y) * f }; }

/* ============ 自動検出（四隅ファインダ） ============ */
// 検出・サンプリング・デコードの中核は js/decode-core.js に集約(DOM 非依存)。
// ここでは現在の src canvas のピクセルを ImageData として渡すだけ。
function currentImage() {
  const id = sctx.getImageData(0, 0, src.width, src.height);
  return { data: id.data, width: src.width, height: src.height };
}
function currentOpt() {
  return { invert: document.getElementById('invert').checked };
}

// 手順: グレースケール→大津の閾値で二値化→連結成分で四隅ファインダの重心→
//       ファインダ中心からデータグリッド四隅へ補正(斜めでも各辺で補正)。
function autoDetect() {
  const img = currentImage();
  const found = DC.detectCorners(img, currentOpt());
  if (!found) {
    setStatus('自動検出できませんでした。赤枠の角を手で合わせてください。', 'bad');
    const w = src.width, h = src.height;
    corners = [
      { x: w * 0.10, y: h * 0.08 }, { x: w * 0.90, y: h * 0.08 },
      { x: w * 0.90, y: h * 0.86 }, { x: w * 0.10, y: h * 0.86 },
    ];
    redraw();
    return;
  }
  corners = found;
  setStatus('四隅を自動検出しました。ズレていれば角をドラッグして調整してください。（斜め撮影は射影変換で自動補正）', 'ok');
  redraw();
}

document.getElementById('autoBtn').onclick = autoDetect;
document.getElementById('invert').onchange = () => { if (hasImage) autoDetect(); };

/* ============ セル読み取り & デコード ============ */
// 射影変換(斜め補正)+適応サンプリング窓+全モード試し読みは decode-core.js。
document.getElementById('decodeBtn').onclick = () => {
  if (!corners) { setStatus('先に四隅を合わせてください', 'bad'); return; }

  const { meta, payload, prof, dec } = DC.decodeAnyMode(currentImage(), corners, currentOpt());
  if (!meta) {
    setStatus('ヘッダを認識できませんでした。グリッドを合わせ直してください（MAGIC不一致）。', 'bad');
    return;
  }
  if (!payload || !meta.checksumOk) {
    setStatus(`ヘッダのチェックサムNG。少しズレている可能性大。角を微調整して再試行してください。\n(読めた値: mode ${meta.mode.toUpperCase()} page ${meta.pageIndex+1}/${meta.totalPages})`, 'bad');
    return;
  }
  const eccName = (CF.ECC_LEVELS[meta.eccLevel] || CF.ECC_LEVELS[0]).label;
  // 本文の RS デコードが訂正能力を超えた場合は要再スキャン
  if (!dec || !dec.ok) {
    setStatus(`⚠ [${meta.mode.toUpperCase()} / ECC:${eccName}] page ${meta.pageIndex+1}/${meta.totalPages} は誤りが多すぎて訂正できませんでした。\n` +
      `角を微調整するか、より高解像度で再スキャンしてください。ECCレベルの高いカードを使うと復元しやすくなります。`, 'bad');
    return;
  }
  // 収集に反映（モードもページ間で一致していることを確認）
  if (expectedMode && expectedMode !== meta.mode) {
    setStatus(`⚠ これまでは ${expectedMode.toUpperCase()} モードのカードでした。異なるモード(${meta.mode.toUpperCase()})のカードが混在しています。リセットしてやり直してください。`, 'bad');
    return;
  }
  expectedMode = meta.mode;
  expectedTotal = meta.totalPages;
  expectedFileLen = meta.totalFileLen;
  // dec.data が誤り訂正済みの正味データ
  collected[meta.pageIndex] = { payload: dec.data, payloadLen: meta.payloadLen, meta };
  const corrMsg = dec.corrected > 0 ? `・${dec.corrected}バイトを誤り訂正` : '';
  setStatus(`✅ [${meta.mode.toUpperCase()} / ECC:${eccName}] page ${meta.pageIndex + 1}/${meta.totalPages} を取得（payload ${meta.payloadLen}B${corrMsg}）`, 'ok');
  updateCollectionUI();
};

function updateCollectionUI() {
  const pills = document.getElementById('pagePills');
  const list = document.getElementById('pageList');
  pills.innerHTML = ''; list.innerHTML = '';
  if (expectedTotal == null) return;
  let haveAll = true;
  for (let i = 0; i < expectedTotal; i++) {
    const has = !!collected[i];
    if (!has) haveAll = false;
    const s = document.createElement('span');
    s.className = 'pill ' + (has ? 'have' : 'miss');
    s.textContent = `p${i + 1}${has ? '✓' : '…'}`;
    pills.appendChild(s);
  }
  Object.keys(collected).sort((a,b)=>a-b).forEach(k => {
    const c = collected[k];
    const li = document.createElement('li');
    li.textContent = `page ${(+k)+1}/${expectedTotal}  payload ${c.payloadLen}B`;
    list.appendChild(li);
  });
  document.getElementById('exportBtn').disabled = !haveAll;
  const es = document.getElementById('exportStatus');
  es.className = 'status ' + (haveAll ? 'ok' : 'info');
  const modeTag = expectedMode ? `[${expectedMode.toUpperCase()}] ` : '';
  es.textContent = haveAll
    ? `${modeTag}全 ${expectedTotal} ページ収集完了。保存できます（合計 ${expectedFileLen}B）。`
    : `${modeTag}残り ${expectedTotal - Object.keys(collected).length} ページ。次のカードを読み込んで追加してください。`;
}

/* ============ 結合してエクスポート ============ */
const CZ = window.NaidesuCompress;
document.getElementById('exportBtn').onclick = async () => {
  if (expectedTotal == null) return;
  // 1) 全ページのペイロードを結合（= creator が splitFile に渡したバイト列）
  const out = new Uint8Array(expectedFileLen);
  let off = 0;
  for (let i = 0; i < expectedTotal; i++) {
    const c = collected[i];
    if (!c) { setStatus(`page ${i+1} が未収集です`, 'bad'); return; }
    const len = c.payloadLen;
    out.set(c.payload.subarray(0, len), off);
    off += len;
  }

  // 2) 圧縮コンテナか自動判別 → 圧縮されていれば自動展開（破損検知付き）
  let finalBytes = out;
  const es = document.getElementById('exportStatus');
  if (CZ && CZ.isContainer(out)) {
    try {
      const r = await CZ.autoDecompress(out);
      finalBytes = r.data;
      es.className = 'status ok';
      es.textContent = r.wasCompressed
        ? `🗜️ 圧縮を自動検出 → ${r.methodName} で展開しました（${out.length}B → ${finalBytes.length}B）。ファイルを保存します。`
        : `圧縮コンテナ（無圧縮/STORE）を検出。${finalBytes.length}B を保存します。`;
    } catch (e) {
      setStatus(`⚠ 圧縮データの展開に失敗しました（${e.message}）。ページの読み取りにズレ・誤りが残っている可能性があります。角を微調整して再取得してください。`, 'bad');
      return;
    }
  } else {
    es.className = 'status ok';
    es.textContent = `無圧縮データとして ${finalBytes.length}B を保存します。`;
  }

  // 3) 保存
  const blob = new Blob([finalBytes], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'restored_naidesu.bin';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

document.getElementById('resetBtn').onclick = () => {
  collected = {}; expectedTotal = null; expectedFileLen = null; expectedMode = null;
  updateCollectionUI();
  setStatus('収集をリセットしました', 'info');
};

/* ============ ドラッグ（マウス+タッチ） ============ */
function evtToImg(clientX, clientY) {
  const r = view.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (view.width / r.width),
    y: (clientY - r.top) * (view.height / r.height),
  };
}
function pickHandle(x, y) {
  if (!corners) return -1;
  const thr = Math.max(30, src.width / 40);
  let bi = -1, bd = thr;
  corners.forEach((p, i) => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; bi = i; } });
  return bi;
}
view.addEventListener('mousedown', (e) => {
  const p = evtToImg(e.clientX, e.clientY); dragIdx = pickHandle(p.x, p.y);
});
window.addEventListener('mousemove', (e) => {
  if (dragIdx < 0) return;
  const p = evtToImg(e.clientX, e.clientY);
  corners[dragIdx] = p; redraw();
});
window.addEventListener('mouseup', () => dragIdx = -1);

view.addEventListener('touchstart', (e) => {
  const t = e.touches[0]; const p = evtToImg(t.clientX, t.clientY);
  dragIdx = pickHandle(p.x, p.y);
  if (dragIdx >= 0) e.preventDefault();
}, { passive: false });
view.addEventListener('touchmove', (e) => {
  if (dragIdx < 0) return;
  const t = e.touches[0]; const p = evtToImg(t.clientX, t.clientY);
  corners[dragIdx] = p; redraw(); e.preventDefault();
}, { passive: false });
view.addEventListener('touchend', () => dragIdx = -1);
</script>
</body>
</html>
